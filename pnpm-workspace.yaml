packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  esbuild: true
overrides:
  # Correctifs de sécurité mineurs, transitifs via l'outillage de build Expo/EAS (jamais exécutés
  # dans le binaire iOS livré) — revue R3 (docs/review.md). Sélecteur ciblé et borné (pas de `>=`
  # ouvert) : ne touche que les versions vulnérables, plafonné sous la prochaine majeure.
  # uuid : xcode@3.0.1 (via @expo/config-plugins) dépend de `^7.0.3` et n'utilise que l'API stable
  # `require('uuid').v4()` ; uuid@11 reste un paquet dual CJS/ESM (`exports.require` présent) —
  # vérifié par `require()` direct en Node (pas seulement le bundle Metro) : fonctionne.
  "uuid@<11.1.1": "^11.1.1"
  # decode-uri-component : PAS d'override, voir apps/mobile/package.json (dette documentée) —
  # 0.5.0 est un paquet ESM pur sans condition `require`, et query-string@7.1.3 (via expo-router)
  # le charge en CJS (`require('decode-uri-component')`) ; `require()` direct en Node casse
  # (`decodeComponent is not a function`), alors que `expo export --platform web` passe quand même
  # (Metro interopère ESM/CJS lui-même, ce n'est pas une preuve fiable pour l'outillage CLI Node).
