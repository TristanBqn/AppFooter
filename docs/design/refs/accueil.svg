      <text y="818" fill="#1859B0">Accueil</text>
    </g>
    <g transform="translate(195 0)" fill="none" stroke="#3A5578" stroke-width="2" stroke-linecap="round">
      <path d="M-9 800v-8M0 800v-16M9 800v-11"/>
      <text y="818" fill="#3A5578" stroke="none">Classement</text>
    </g>
    <g transform="translate(325 0)" fill="none" stroke="#3A5578" stroke-width="2">
      <circle cx="-5" cy="787" r="4"/><circle cx="6" cy="789" r="3"/>
      <path d="M-13 800a8 7 0 0 1 16 0M2 800a6 5 0 0 1 11 0" stroke-linecap="round"/>
      <text y="818" fill="#3A5578" stroke="none">Amis</text>
    </g>
