<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" font-family="'SF Pro Rounded', ui-rounded, -apple-system, 'Segoe UI', system-ui, sans-serif">
  <title>Footer – Accueil (référence, taille de texte par défaut)</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BFDFFF"/>
      <stop offset="0.35" stop-color="#D6EBFF"/>
      <stop offset="0.7" stop-color="#EEF7FF"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF6DB" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFF6DB" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F7BDD"/>
      <stop offset="1" stop-color="#1859B0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
