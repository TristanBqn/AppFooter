    </filter>
    <path id="cloud" d="M30 60a30 30 0 0 1 0-60c8 0 15 3 20 8a38 38 0 0 1 68 6a24 24 0 0 1 12-3a24 24 0 0 1 0 49z"/>
  </defs>

  <rect width="390" height="844" fill="url(#sky)"/>
  <circle cx="330" cy="40" r="120" fill="url(#sun)"/>
  <use href="#cloud" fill="#FFFFFF" opacity="0.7" transform="translate(-70 150) scale(0.9)"/>
  <use href="#cloud" fill="#FFFFFF" opacity="0.5" transform="translate(250 190) scale(0.7)"/>

  <!-- Barre d'état -->
  <text x="32" y="34" font-size="16" font-weight="600" fill="#0B2545">9:41</text>

  <!-- En-tête -->
  <text x="20" y="92" font-size="15" fill="#3A5578">Jeudi 24 septembre</text>
  <text x="20" y="128" font-size="34" font-weight="700" fill="#0B2545">Bonjour tom</text>
  <!-- Bouton Paramètres (44 x 44) -->
  <circle cx="348" cy="116" r="22" fill="#FFFFFF" fill-opacity="0.62" stroke="#FFFFFF" stroke-opacity="0.85"/>
  <g transform="translate(348 116)" fill="none" stroke="#1859B0" stroke-width="1.8" stroke-linejoin="round">
    <path d="M7.02 -2.91L10.25 -2.29L10.25 2.29L7.02 2.91L8.87 5.63L5.63 8.87L2.91 7.02L2.29 10.25L-2.29 10.25L-2.91 7.02L-5.63 8.87L-8.87 5.63L-7.02 2.91L-10.25 2.29L-10.25 -2.29L-7.02 -2.91L-8.87 -5.63L-5.63 -8.87L-2.91 -7.02L-2.29 -10.25L2.29 -10.25L2.91 -7.02L5.63 -8.87L8.87 -5.63Z"/>
    <circle r="3.2"/>
  </g>

  <!-- Carte principale : anneau -->
  <g filter="url(#soft)">
    <rect x="20" y="156" width="350" height="360" rx="24" fill="#FFFFFF" fill-opacity="0.62" stroke="#FFFFFF" stroke-opacity="0.85"/>
  </g>
  <g transform="translate(195 318)">
    <circle r="111" fill="none" stroke="#1859B0" stroke-opacity="0.14" stroke-width="18"/>
    <!-- 8 450 / 10 000 depuis 5 000 : 69 % -->
    <circle r="111" fill="none" stroke="url(#ring)" stroke-width="18" stroke-linecap="round"
            stroke-dasharray="481 697" transform="rotate(-90)"/>
    <text y="-6" text-anchor="middle" font-size="64" font-weight="700" fill="#0B2545">8 450</text>
    <text y="26" text-anchor="middle" font-size="17" fill="#3A5578">pas aujourd'hui</text>
  </g>
  <text x="195" y="482" text-anchor="middle" font-size="17" font-weight="600" fill="#0B2545">Encore 1 550 pas pour 10 000</text>

  <!-- Deux indicateurs -->
  <g filter="url(#soft)">
    <rect x="20" y="532" width="350" height="96" rx="24" fill="#FFFFFF" fill-opacity="0.62" stroke="#FFFFFF" stroke-opacity="0.85"/>
  </g>
  <text x="40" y="566" font-size="13" fill="#3A5578">Calories actives</text>
  <text x="40" y="600" font-size="22" font-weight="600" fill="#0B2545">312 kcal</text>
  <line x1="195" y1="552" x2="195" y2="608" stroke="#0B2545" stroke-opacity="0.1"/>
  <text x="215" y="566" font-size="13" fill="#3A5578">Rang du jour</text>
  <text x="215" y="600" font-size="22" font-weight="600" fill="#0B2545">2e <tspan font-size="15" font-weight="400" fill="#3A5578">sur 5</tspan></text>

  <!-- Prochain objectif amical -->
  <g filter="url(#soft)">
    <rect x="20" y="644" width="350" height="80" rx="24" fill="#FFFFFF" fill-opacity="0.62" stroke="#FFFFFF" stroke-opacity="0.85"/>
  </g>
  <circle cx="60" cy="684" r="20" fill="#D6EBFF"/>
  <text x="60" y="690" text-anchor="middle" font-size="17" font-weight="600" fill="#1859B0">L</text>
  <text x="92" y="678" font-size="17" font-weight="600" fill="#0B2545">Encore 1 201 pas</text>
  <text x="92" y="700" font-size="15" fill="#3A5578">pour dépasser lea</text>
  <text x="346" y="690" text-anchor="end" font-size="20" fill="#3A5578">›</text>

  <!-- Barre d'onglets en verre -->
  <rect x="0" y="760" width="390" height="84" fill="#FFFFFF" fill-opacity="0.78"/>
  <line x1="0" y1="760" x2="390" y2="760" stroke="#0B2545" stroke-opacity="0.1"/>
  <g font-size="11" font-weight="500" text-anchor="middle">
    <g transform="translate(65 0)">
